# rustfmt configuration for the LuisaCompute Rust workspace.
# Keep this file in sync with any editor / IDE format-on-save settings.
# Only stable rustfmt options are used here; nightly-only options
# (imports_granularity, group_imports, trailing_comma) are omitted so that
# the formatter works with the stable toolchain installed in CI.

edition = "2021"

# Maximum line width before rustfmt wraps lines
max_width = 100

# Use the default set of heuristics for short items
use_small_heuristics = "Default"

# Reorder module-level `use` declarations alphabetically within groups
reorder_imports = true

# Reorder `mod` declarations to match import ordering conventions
reorder_modules = true
