[build-system]
requires = ["pybind11", "scikit-build-core>=0.3.2", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "luisa-python"
dynamic = ["version"]
description = "A High-Performance Rendering Framework with Layered and Unified Interfaces on Stream Architectures"
readme = "README.md"
authors = [
    { name = "LuisaGroup" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sourceinspect",
    "numpy",
]
license = { file = "LICENSE" }
keywords = ["luisa", "rendering", "framework", "gpu", "stream", "architecture"]

[project.urls]
Homepage = "https://www.luisa-render.com"
Repository = "https://github.com/LuisaGroup/LuisaCompute"
Issues = "https://github.com/LuisaGroup/LuisaCompute/issues"

[tool.scikit-build]
cmake.version = ">=3.28"
cmake.build-type = "Release"
cmake.args = ["-G Ninja"]
ninja.version = ">=1.11"
ninja.make-fallback = false
sdist.reproducible = false
wheel.expand-macos-universal-tags = true
wheel.packages = []
# this causes CMake referencing a temporarily installed ninja
# build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/luisa/version.h"
regex = '''(?sx)
\#define \s+ LUISA_COMPUTE_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ LUISA_COMPUTE_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ LUISA_COMPUTE_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"

[tool.scikit-build.cmake.define]
LUISA_COMPUTE_BUILD_TESTS = "OFF"
LUISA_COMPUTE_DOWNLOAD_NVCOMP = "OFF"
LUISA_COMPUTE_USE_SYSTEM_STL = "ON"

# ---------------------------------------------------------------------------
# ruff — fast Python linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
# Match the minimum supported Python version declared in [project]
target-version = "py310"
# Use a generous line length; hard wrap is not enforced (see ruff.lint ignore E501)
line-length = 120

# Exclude vendored / generated Python scripts that are not first-party code.
extend-exclude = [
    "src/backends/metal/metal-cpp",       # vendored Apple Metal-CPP headers & tools
    "src/backends/cuda/lcub/codegen",     # CUDA CUB wrapper codegen scripts
    "src/backends/metal/metal-tex-compress",  # third-party texture compression tool
]

[tool.ruff.lint]
# Enable a comprehensive set of rule families:
#   E/W  — pycodestyle errors & warnings (PEP 8 style)
#   F    — Pyflakes (undefined names, unused imports, …)
#   I    — isort  (import ordering)
#   N    — pep8-naming (naming conventions)
#   UP   — pyupgrade (modern Python idioms)
#   B    — flake8-bugbear (likely bugs & design issues)
#   C4   — flake8-comprehensions (simplify list/dict/set comprehensions)
#   SIM  — flake8-simplify (unnecessary complexity)
#   RUF  — ruff-specific rules (redundant open modes, etc.)
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

ignore = [
    # Line-length is a formatter concern, not a linting concern
    "E501",
    # The LuisaCompute Python DSL intentionally uses CamelCase variable/function
    # names inside kernel bodies to match the C++ DSL style.
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    # Keep Optional[X] syntax for clarity in existing code; migrate gradually
    "UP007",
    # Ternary operators are sometimes less readable in DSL-heavy code
    "SIM108",
    # Default mutable arguments are intentional in several factory helpers
    "B006",
    # Do not complain about function calls in default arguments (used for
    # lctype defaults and similar patterns throughout the DSL)
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Test/example scripts may use wildcard imports and don't need strict naming
"src/tests/**" = ["F401", "F403", "F405", "F811", "N", "UP", "W191", "E101", "E402"]
# The DSL type definitions use lowercase class names (uint, half, short, …) to
# mirror C++ primitive types — suppress N801 (invalid-class-name) for these files.
"src/py/luisa/types.py"      = ["N801"]
"src/py/luisa/lcapi.pyi"     = ["N801"]
"src/py/luisa/mathtypes.pyi" = ["N801"]
# The `func` class implements the @func decorator; its lowercase name is part of
# the public DSL API (users write `@luisa.func`) and cannot be renamed.
# It also uses `from .mathtypes import *` for vector types in the DSL.
"src/py/luisa/func.py" = ["N801", "F403", "F405"]
# __init__.py files are public-API re-export modules; E402 and F401/F403/F405 are
# intentional (imports must follow a conditional Jupyter detection block, and
# every imported name is re-exported for callers of `import luisa`).
"src/py/luisa/__init__.py" = ["E402", "F401", "F403", "F405"]
# These DSL library files use `from .mathtypes import *` to get all vector types
# into scope — the same pattern as the generated kernel bodies they support.
"src/py/luisa/accel.py"    = ["F403", "F405"]
"src/py/luisa/bindless.py" = ["F403", "F405"]
"src/py/luisa/buffer.py"   = ["F403", "F405"]
"src/py/luisa/builtin.py"  = ["F403", "F405"]
"src/py/luisa/hit.py"      = ["F403", "F405"]
"src/py/luisa/image2d.py"  = ["F403", "F405"]
"src/py/luisa/image3d.py"  = ["F403", "F405"]
"src/py/luisa/raster.py"   = ["F403", "F405"]
"src/py/luisa/rayquery.py" = ["F403", "F405"]
"src/py/luisa/util.py"     = ["F403", "F405"]
# auto-generated vector swizzle boilerplate
"src/py/luisa/vector.py" = ["N", "RUF"]

# ---------------------------------------------------------------------------
# mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/py", "src/xir", "bootstrap.py", "include/luisa/ir_v2/gen_ir_def.py"]

# Permissive stubs: many C-extension dependencies have no type stubs
ignore_missing_imports = true

# Check function bodies even when they lack annotations
check_untyped_defs = true

# Catch suspicious patterns
warn_return_any        = true
warn_unused_ignores    = true
warn_redundant_casts   = true
warn_unused_configs    = true

# Exclude files that are intentionally untyped or auto-generated
exclude = [
    "src/py/luisa/dylibs",  # compiled pybind11 extension (no stubs)
]
